<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar System Observatory</title><style>
:root{color-scheme:dark;--panel:#101b2dcc;--accent:#75d7ff;--ink:#e8f2ff}*{box-sizing:border-box}body{margin:0;background:#020610;color:var(--ink);font:14px system-ui,sans-serif}#app{min-height:100vh;display:grid;grid-template-columns:minmax(280px,1fr) 330px;gap:12px;padding:12px}.stage{min-height:620px;position:relative;background:#050b1b;border:1px solid #294466;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.badge{position:absolute;top:12px;left:12px;background:var(--panel);padding:9px;border-radius:8px}.panel{background:var(--panel);border:1px solid #294466;border-radius:12px;padding:12px;display:grid;gap:10px;align-content:start}button,input,textarea{font:inherit}button{cursor:pointer;padding:8px;border:1px solid #467aa5;border-radius:6px;background:#18314e;color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffcf5c;outline-offset:2px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row label{flex:1 1 115px}.row input[type=range]{width:100%}.planet{display:flex;justify-content:space-between;width:100%}.planet[aria-pressed=true]{background:#185277;border-color:#9feaff}.notice{min-height:1.3em;color:#ffd36f}.error{color:#ff9191}.info,.snapshot{border-left:3px solid #4279ad;padding:8px;background:#0a1424}.snapshot small{display:block;color:#bad0e6}textarea{width:100%;min-height:105px;background:#07101e;color:var(--ink);border:1px solid #467aa5;border-radius:6px;padding:7px}h1,h2,p{margin:0}h1{font-size:1.1rem}h2{font-size:1rem}.hint{color:#b4c9e0;font-size:.85em}@media(max-width:700px){#app{grid-template-columns:1fr;padding:7px}.stage{min-height:430px}.panel{grid-row:1}.stage{grid-row:2}}
</style></head><body><main id="app"><section class="stage" aria-label="Interactive 3D solar system"><div class="badge"><h1>Solar System Observatory</h1><span id="timeReadout">Time 0.00 s</span> · <span id="modeReadout">Overview</span></div></section><aside class="panel" aria-label="Observatory controls"><div class="row"><button id="pause">Pause</button><button id="track" disabled>Track selected</button><button id="overview">Full overview</button></div><div><label for="time">Simulation time <output id="timeOut">0.00 s</output></label><input id="time" aria-label="Simulation time" type="range" min="0" max="120" step="0.01" value="0"></div><div><label for="speed">Global speed <output id="speedOut">1.00x</output></label><input id="speed" aria-label="Global speed" type="range" min="0.25" max="4" step="0.05" value="1"></div><div><h2>Planets</h2><div id="planets"></div><p class="hint">IDs: ember, azure, jade</p></div><div class="info" id="info">No planet selected.</div><div><div class="row"><button id="capture">Capture snapshot</button><button id="export">Export JSON</button><button id="import">Import JSON</button></div><div id="notice" class="notice" role="status"></div><textarea id="json" aria-label="Snapshot JSON" placeholder='{"version":1,"snapshots":[]}'></textarea></div><div><h2>Snapshots (maximum 3)</h2><div id="snapshots"></div></div></aside></main>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id), planets=[['ember','Ember',1.1,0xff765c,7,12,0],['azure','Azure',.82,0x54a8ff,10,24,1.2],['jade','Jade',.65,0x60d889,13,48,2.4]];let t=0,speed=1,playing=true,selected=null,mode='overview',snaps=[],last=performance.now(),drag=false,theta=.55,phi=.75,dist=30,storageOK=true;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('.stage').append(renderer.domElement);scene.add(new THREE.AmbientLight(0x8aaadd,1.8));const light=new THREE.PointLight(0xffffff,3);scene.add(light);const sun=new THREE.Mesh(new THREE.SphereGeometry(2.2,32,20),new THREE.MeshStandardMaterial({emissive:0xffa330,emissiveIntensity:1,color:0xff9c29}));scene.add(sun);const mesh={};planets.forEach(([id,name,r,color,orbit,period,phase])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.15}));m.userData.id=id;scene.add(m);mesh[id]=m;const ring=new THREE.Mesh(new THREE.TorusGeometry(orbit,.025,6,80),new THREE.MeshBasicMaterial({color:0x314664}));ring.rotation.x=Math.PI/2;scene.add(ring)});const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
function angles(x=t){return Object.fromEntries(planets.map(([id,,,,period,phase])=>[id,((x/period*360+phase*180/Math.PI)%360+360)%360]))}function pos(p,x=t){const a=(x/p[5]*Math.PI*2+p[6]);return [Math.cos(a)*p[4],0,Math.sin(a)*p[4]]}function state(){return {version:1,snapshots:snaps.map(({id,time,speed,selectedPlanet,viewMode})=>({id,time,speed,selectedPlanet,viewMode}))}}function valid(o){if(!o||Array.isArray(o)||o.version!==1||!Array.isArray(o.snapshots)||o.snapshots.length>3)throw Error('JSON must contain version 1 and zero to three snapshots.');const ids=new Set;return o.snapshots.map(x=>{if(!x||Array.isArray(x)||!['id','time','speed','selectedPlanet','viewMode'].every(k=>Object.hasOwn(x,k))||typeof x.id!=='string'||!x.id||ids.has(x.id)||typeof x.time!=='number'||!Number.isFinite(x.time)||x.time<0||x.time>120||typeof x.speed!=='number'||!Number.isFinite(x.speed)||x.speed<.25||x.speed>4||!(x.selectedPlanet===null||planets.some(p=>p[0]===x.selectedPlanet))||!['overview','tracking'].includes(x.viewMode)||(x.viewMode==='tracking'&&!x.selectedPlanet))throw Error('Invalid snapshot contract; no changes were made.');ids.add(x.id);return {id:x.id,time:x.time,speed:x.speed,selectedPlanet:x.selectedPlanet,viewMode:x.viewMode}})}function save(){try{localStorage.setItem('solar-observations',JSON.stringify(state()));storageOK=true}catch(e){storageOK=false;notice('Saving unavailable; snapshots remain in memory.',true)}}function notice(x,err=false){$('notice').textContent=x;$('notice').className='notice '+(err?'error':'')}function select(id){selected=id;$('track').disabled=!id;document.querySelectorAll('.planet').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));renderUI()}function restore(x){playing=false;t=x.time;speed=x.speed;selected=x.selectedPlanet;mode=x.viewMode;$('time').value=t;$('speed').value=speed;select(selected);notice('Snapshot restored; playback paused.')}function renderUI(){const a=angles();$('timeOut').textContent=t.toFixed(2)+' s';$('timeReadout').textContent='Time '+t.toFixed(2)+' s';$('speedOut').textContent=speed.toFixed(2)+'x';$('pause').textContent=playing?'Pause':'Resume';$('modeReadout').textContent=mode==='tracking'?'Tracking '+(selected||''):'Overview';$('info').textContent=selected?`${planets.find(p=>p[0]===selected)[1]} — period ${planets.find(p=>p[0]===selected)[5]} s; angle ${a[selected].toFixed(1)}°`:'No planet selected.';Object.values(mesh).forEach(m=>m.material.emissiveIntensity=m.userData.id===selected?1.2:.15);$('snapshots').innerHTML='';snaps.forEach(x=>{const d=document.createElement('div');d.className='snapshot';const an=angles(x.time);d.innerHTML=`<strong>${x.id}</strong><small>t ${x.time.toFixed(2)} · ${x.speed}x · ${x.selectedPlanet??'no selection'} · ${x.viewMode}</small><small>angles: ember ${an.ember.toFixed(1)}°, azure ${an.azure.toFixed(1)}°, jade ${an.jade.toFixed(1)}°</small>`;const r=document.createElement('button');r.textContent='Restore';r.setAttribute('aria-label','Restore snapshot '+x.id);r.onclick=()=>restore(x);const del=document.createElement('button');del.textContent='Delete';del.setAttribute('aria-label','Delete snapshot '+x.id);del.onclick=()=>{snaps=snaps.filter(y=>y!==x);save();renderUI()};d.append(r,del);$('snapshots').append(d)})}
planets.forEach(([id,name])=>{const b=document.createElement('button');b.className='planet';b.dataset.id=id;b.setAttribute('aria-pressed','false');b.textContent=name+' ('+id+')';b.onclick=()=>select(id);$('planets').append(b)});$('pause').onclick=()=>{playing=!playing;renderUI()};$('overview').onclick=()=>{mode='overview';renderUI()};$('track').onclick=()=>{if(!selected)return notice('Choose a planet before tracking.',true);mode='tracking';renderUI()};$('time').oninput=e=>{t=+e.target.value;playing=false;renderUI()};$('speed').oninput=e=>{speed=+e.target.value;renderUI()};$('capture').onclick=()=>{if(snaps.length>=3)return notice('Snapshot capacity reached; delete one before capturing.',true);let i=1,id;do{id='obs-'+i++}while(snaps.some(x=>x.id===id));snaps.push({id,time:t,speed,selectedPlanet:selected,viewMode:mode});save();renderUI();notice('Snapshot captured.')};$('export').onclick=()=>{$('json').value=JSON.stringify(state());notice('Snapshot JSON exported.')};$('import').onclick=()=>{try{const next=valid(JSON.parse($('json').value));snaps=next;save();renderUI();notice('Snapshot JSON imported.')}catch(e){notice(e.message,true)}};
try{const raw=localStorage.getItem('solar-observations');if(raw)snaps=valid(JSON.parse(raw))}catch(e){snaps=[];notice('Saved snapshots were invalid and were cleared.',true)}function resize(){const r=renderer.domElement.parentElement.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);renderer.domElement.addEventListener('pointerdown',e=>{drag=false;renderer.domElement.setPointerCapture(e.pointerId);renderer.dataset.x=e.clientX;renderer.dataset.y=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(!renderer.domElement.hasPointerCapture(e.pointerId))return;let dx=e.clientX-renderer.dataset.x,dy=e.clientY-renderer.dataset.y;if(Math.abs(dx)+Math.abs(dy)>3)drag=true;theta-=dx*.01;phi=Math.max(.15,Math.min(1.45,phi-dy*.01));renderer.dataset.x=e.clientX;renderer.dataset.y=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(!drag){const r=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(Object.values(mesh))[0];if(hit)select(hit.object.userData.id)}});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(12,Math.min(48,dist+e.deltaY*.02));e.preventDefault()},{passive:false});function frame(now){const dt=(now-last)/1000;last=now;if(playing){t=Math.min(120,t+dt*speed);if(t===120)playing=false}planets.forEach(p=>{const q=pos(p);mesh[p[0]].position.set(...q)});let target=new THREE.Vector3();if(mode==='tracking'&&selected)target.copy(mesh[selected].position);camera.position.set(target.x+dist*Math.sin(phi)*Math.cos(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.sin(theta));camera.lookAt(target);renderUI();renderer.render(scene,camera);requestAnimationFrame(frame)}resize();renderUI();requestAnimationFrame(frame)})();
</script></body></html>

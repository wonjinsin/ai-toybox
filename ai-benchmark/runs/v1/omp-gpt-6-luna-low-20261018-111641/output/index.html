<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar System Observatory</title><style>
:root{color-scheme:dark;--bg:#070b17;--panel:#111a2e;--ink:#edf3ff;--muted:#9aaac5;--accent:#71d5ff;--line:#263653}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#15284b,#070b17 70%);color:var(--ink);font:15px/1.45 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}h1{margin:0;font-size:1.35rem}main{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:16px}.scene-wrap,.panel{background:#0c1425dd;border:1px solid var(--line);border-radius:16px;overflow:hidden}.scene-wrap{position:relative;min-height:480px}canvas{display:block;width:100%;height:100%;min-height:480px;touch-action:none}.overlay{position:absolute;top:14px;left:14px;background:#07101dcc;padding:8px 12px;border-radius:10px;color:var(--muted)}aside{display:grid;gap:12px;align-content:start}.panel{padding:16px}.panel h2{font-size:1rem;margin:0 0 12px;color:var(--accent)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0}button,select,input,textarea{font:inherit;color:var(--ink);background:#182541;border:1px solid #405475;border-radius:8px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}input[type=range]{flex:1;min-width:100px;accent-color:var(--accent)}label{color:var(--muted)}.planet-list{display:flex;flex-wrap:wrap;gap:8px}.planet-list button[aria-pressed=true]{outline:2px solid var(--accent)}.info{color:var(--muted);min-height:60px}.snapshot{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:5px}.snapshot small{color:var(--muted)}textarea{width:100%;min-height:110px;resize:vertical;font:12px ui-monospace,monospace}.notice{color:#ffd58c;min-height:1.3em}.ids{font-size:12px;color:var(--muted)}:focus-visible{outline:3px solid #ffe08a;outline-offset:2px}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}.scene-wrap,canvas{min-height:360px}header{padding:14px}.panel{padding:13px}}
</style></head><body><header><h1>✦ Solar System Observatory</h1><span>Interactive 3D · deterministic orbits</span></header><main><section class="scene-wrap"><canvas id="space" aria-label="Interactive 3D solar system. Drag to orbit; scroll to zoom."></canvas><div class="overlay" id="sceneStatus">Overview · drag to orbit · scroll to zoom</div></section><aside>
<section class="panel"><h2>Simulation</h2><div class="row"><button id="play" aria-label="Pause simulation">❚❚ Pause</button><label for="speed">Speed</label><input id="speed" aria-label="Simulation speed" type="range" min="0.25" max="4" step="0.25" value="1"><output id="speedOut">1.00×</output></div><div class="row"><label for="time">Time</label><input id="time" aria-label="Simulation time, 0 to 120 seconds" type="range" min="0" max="120" step="0.1" value="0"><output id="timeOut">0.0 s</output></div></section>
<section class="panel"><h2>Planets</h2><div class="planet-list" id="planets"></div><p class="ids">IDs: Mercury = mercury, Venus = venus, Earth = earth</p><div class="info" id="info" aria-live="polite">No planet selected.</div><div class="row"><button id="track" aria-label="Track selected planet">Track selected</button><button id="overview">Full-system overview</button></div></section>
<section class="panel"><h2>Observations <span id="count">0 / 3</span></h2><div class="row"><button id="capture">Capture snapshot</button></div><div id="snapshots"></div><p class="notice" id="notice" aria-live="polite"></p></section>
<section class="panel"><h2>Snapshot JSON</h2><label for="json">Export or import snapshots (IDs shown above)</label><textarea id="json" spellcheck="false" aria-label="Snapshot JSON"></textarea><div class="row"><button id="export">Export JSON</button><button id="import">Import JSON</button></div></section></aside></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const defs=[{id:'mercury',name:'Mercury',color:0xb8c5d8,r:0.34,orbit:3.3,period:12,phase:0},{id:'venus',name:'Venus',color:0xffbd69,r:0.49,orbit:5.1,period:24,phase:1.2},{id:'earth',name:'Earth',color:0x48aaff,r:0.57,orbit:7.1,period:48,phase:2.4}],$=id=>document.getElementById(id);let t=0,speed=1,playing=true,selected=null,mode='overview',last=performance.now(),drag=null,down=null,camYaw=.7,camPitch=.45,camDist=15,shots=[],renderer,scene,camera,controls=[],raycaster,mouse,storageOK=true;
const canvas=$('space'),ctx=canvas.getContext('2d');function init(){if(window.THREE){scene=new THREE.Scene();scene.background=new THREE.Color(0x070b17);camera=new THREE.PerspectiveCamera(45,1,.1,1000);renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);scene.add(new THREE.AmbientLight(0x9caed0,1.8));const light=new THREE.PointLight(0xffd48a,80,80);scene.add(light);const sun=new THREE.Mesh(new THREE.SphereGeometry(.9,32,24),new THREE.MeshStandardMaterial({color:0xffbd55,emissive:0xff7a18,emissiveIntensity:1.4}));sun.userData.id='sun';scene.add(sun);for(const d of defs){const m=new THREE.Mesh(new THREE.SphereGeometry(d.r,28,20),new THREE.MeshStandardMaterial({color:d.color,roughness:.72,emissive:d.color,emissiveIntensity:.09}));m.userData.id=d.id;scene.add(m);controls.push(m);const pts=[];for(let i=0;i<=128;i++){let a=i*Math.PI*2/128;pts.push(new THREE.Vector3(Math.cos(a)*d.orbit,0,Math.sin(a)*d.orbit))}scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x34425e,transparent:true,opacity:.65}))) }raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();window.addEventListener('resize',resize);resize();}else{window.addEventListener('resize',resize);resize()}animate()}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(renderer){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}else{canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio}}
function angle(d,time=t){return d.phase+time*Math.PI*2/d.period}function update(){if(renderer){defs.forEach((d,i)=>{const a=angle(d);controls[i].position.set(Math.cos(a)*d.orbit,Math.sin(a*1.7)*.13,Math.sin(a)*d.orbit);controls[i].material.emissiveIntensity=d.id===selected?.65:.09});let target=new THREE.Vector3();if(mode==='tracking'&&selected){const p=controls.find(m=>m.userData.id===selected);target.copy(p.position)}const x=target.x+camDist*Math.cos(camPitch)*Math.sin(camYaw),y=target.y+camDist*Math.sin(camPitch),z=target.z+camDist*Math.cos(camPitch)*Math.cos(camYaw);camera.position.set(x,y,z);camera.lookAt(target);renderer.render(scene,camera)}else drawFallback();$('time').value=t;$('timeOut').value=t.toFixed(1)+' s';$('speedOut').value=speed.toFixed(2)+'×';$('sceneStatus').textContent=(mode==='tracking'?'Tracking '+(defs.find(d=>d.id===selected)?.name||''):'Overview')+' · drag to orbit · scroll to zoom';$('info').textContent=selected?`${defs.find(d=>d.id===selected).name} · period ${defs.find(d=>d.id===selected).period}s · angle ${(angle(defs.find(d=>d.id===selected))*180/Math.PI%360+360)%360|0}°`:'No planet selected.';$('track').disabled=!selected;$('planets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===selected)))}
function drawFallback(){const w=canvas.width,h=canvas.height;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let W=canvas.clientWidth,H=canvas.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle='#070b17';ctx.fillRect(0,0,W,H);let scale=Math.min(W,H)*.047,cx=W/2,cy=H/2;defs.forEach(d=>{ctx.strokeStyle='#34425e';ctx.beginPath();ctx.ellipse(cx,cy,d.orbit*scale,d.orbit*scale*.65,0,0,Math.PI*2);ctx.stroke()});ctx.fillStyle='#ffbd55';ctx.beginPath();ctx.arc(cx,cy,14,0,Math.PI*2);ctx.fill();defs.forEach(d=>{let a=angle(d),x=cx+Math.cos(a)*d.orbit*scale,y=cy+Math.sin(a)*d.orbit*scale*.65;ctx.fillStyle='#'+d.color.toString(16).padStart(6,'0');ctx.beginPath();ctx.arc(x,y,d.r*12,0,7);ctx.fill();if(selected===d.id){ctx.strokeStyle='white';ctx.beginPath();ctx.arc(x,y,d.r*15,0,7);ctx.stroke()}})}
function animate(now=performance.now()){if(playing){t=Math.min(120,t+(now-last)/1000*speed);if(t>=120){playing=false;$('play').textContent='▶ Resume';$('play').setAttribute('aria-label','Resume simulation')}}last=now;update();requestAnimationFrame(animate)}
function persist(){try{localStorage.setItem('solar-observatory-v2',JSON.stringify({version:1,snapshots:shots}));storageOK=true;$('notice').textContent=''}catch(e){storageOK=false;$('notice').textContent='Saving unavailable; snapshots remain in memory only.'}}
function valid(obj){if(!obj||typeof obj!=='object'||Array.isArray(obj)||obj.version!==1||!Array.isArray(obj.snapshots)||obj.snapshots.length>3)return false;let ids=new Set;for(const x of obj.snapshots){if(!x||typeof x!=='object'||Array.isArray(x)||!['id','time','speed','selectedPlanet','viewMode'].every(k=>Object.hasOwn(x,k))||typeof x.id!=='string'||x.id.length<1||ids.has(x.id)||typeof x.time!=='number'||!Number.isFinite(x.time)||x.time<0||x.time>120||typeof x.speed!=='number'||!Number.isFinite(x.speed)||x.speed<.25||x.speed>4||!(x.selectedPlanet===null||defs.some(d=>d.id===x.selectedPlanet))||!['overview','tracking'].includes(x.viewMode)||(x.viewMode==='tracking'&&x.selectedPlanet===null))return false;ids.add(x.id)}return true}
function angles(time){return defs.map(d=>({id:d.id,degrees:(angle(d,time)*180/Math.PI%360+360)%360}))}function renderShots(){$('count').textContent=`${shots.length} / 3`;$('snapshots').replaceChildren();shots.forEach((x,i)=>{const box=document.createElement('div');box.className='snapshot';const d=document.createElement('small');d.textContent=`${x.id} · t=${x.time.toFixed(1)}s · ${x.speed}× · ${x.selectedPlanet??'none'} · ${x.viewMode} · ${angles(x.time).map(a=>a.id+': '+a.degrees.toFixed(1)+'°').join(' / ')}`;const row=document.createElement('div'),restore=document.createElement('button'),del=document.createElement('button');restore.textContent='Restore';restore.setAttribute('aria-label',`Restore snapshot ${x.id}`);restore.onclick=()=>{t=x.time;speed=x.speed;selected=x.selectedPlanet;mode=x.viewMode;playing=false;$('play').textContent='▶ Resume';$('play').setAttribute('aria-label','Resume simulation');camYaw=.7;camPitch=.45;camDist=15;update()};del.textContent='Delete';del.setAttribute('aria-label',`Delete snapshot ${x.id}`);del.onclick=()=>{shots.splice(i,1);persist();renderShots()};row.append(restore,del);box.append(d,row);$('snapshots').append(box)})}
function select(id){selected=id;update()}defs.forEach(d=>{let b=document.createElement('button');b.textContent=d.name;b.dataset.id=d.id;b.setAttribute('aria-label',`Select ${d.name}`);b.setAttribute('aria-pressed','false');b.onclick=()=>select(selected===d.id?null:d.id);$('planets').append(b)});
$('play').onclick=()=>{playing=!playing;last=performance.now();$('play').textContent=playing?'❚❚ Pause':'▶ Resume';$('play').setAttribute('aria-label',playing?'Pause simulation':'Resume simulation')};$('speed').oninput=e=>{speed=+e.target.value;update()};$('time').oninput=e=>{playing=false;t=+e.target.value;$('play').textContent='▶ Resume';$('play').setAttribute('aria-label','Resume simulation');update()};$('track').onclick=()=>{if(selected){mode='tracking';update()}};$('overview').onclick=()=>{mode='overview';update()};$('capture').onclick=()=>{if(shots.length>=3){$('notice').textContent='Snapshot capacity reached (3). Delete one to capture another.';return}let id;do{id='obs-'+crypto.randomUUID()}while(shots.some(x=>x.id===id));shots.push({id,time:t,speed,selectedPlanet:selected,viewMode:mode});persist();renderShots()};$('export').onclick=()=>{$('json').value=JSON.stringify({version:1,snapshots:shots.map(({id,time,speed,selectedPlanet,viewMode})=>({id,time,speed,selectedPlanet,viewMode}))},null,2)};$('import').onclick=()=>{try{let o=JSON.parse($('json').value);if(!valid(o))throw Error();shots=o.snapshots.map(x=>({id:x.id,time:x.time,speed:x.speed,selectedPlanet:x.selectedPlanet,viewMode:x.viewMode}));persist();renderShots();$('notice').textContent='Snapshot list imported; live simulation unchanged.'}catch(e){$('notice').textContent='Invalid snapshot JSON; list and simulation unchanged.'}};
try{let saved=localStorage.getItem('solar-observatory-v2');if(saved){let o=JSON.parse(saved);if(valid(o))shots=o.snapshots;else $('notice').textContent='Saved snapshot data was invalid; recovered with an empty list.'}}catch(e){$('notice').textContent='Snapshot storage unavailable; using memory only.'}renderShots();
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};down={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;camYaw-=dx*.008;camPitch=Math.max(-1.35,Math.min(1.35,camPitch+dy*.008));drag.x=e.clientX;drag.y=e.clientY}});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&renderer){let r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);let hit=raycaster.intersectObjects(controls)[0];if(hit)select(hit.object.userData.id)}drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();camDist=Math.max(7,Math.min(32,camDist+e.deltaY*.015))},{passive:false});init();})();
</script></body></html>

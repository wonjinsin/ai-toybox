<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar System Observatory</title>
  <style>
    :root { color-scheme: dark; --ink:#eef5ff; --muted:#a8b9d7; --panel:rgba(11,20,42,.82); --line:rgba(170,205,255,.22); --accent:#7ee7ff; --accent2:#b092ff; --danger:#ffcb70; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:0; overflow-x:hidden; background:#050816; color:var(--ink); font:14px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input { font:inherit; }
    button { color:inherit; background:#15244a; border:1px solid var(--line); border-radius:9px; cursor:pointer; min-height:36px; padding:7px 10px; }
    button:hover, button:focus-visible { border-color:var(--accent); background:#1a3260; outline:none; }
    button[aria-pressed="true"], .planet-item.active { border-color:var(--accent); background:linear-gradient(135deg,#123e62,#253664); box-shadow:0 0 0 1px rgba(126,231,255,.15) inset; }
    button:disabled { cursor:default; opacity:.48; }
    #app { width:100%; min-height:100vh; padding:clamp(10px,2vw,24px); display:grid; grid-template-columns:minmax(0,1fr) minmax(230px,300px); gap:14px; }
    .stage { min-width:0; min-height:0; position:relative; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:radial-gradient(circle at 50% 45%,#101d46 0,#060a1e 46%,#02040c 100%); box-shadow:0 22px 80px rgba(0,0,0,.35); }
    canvas { display:block; width:100%; height:calc(100vh - clamp(20px,4vw,48px)); min-height:480px; touch-action:none; cursor:grab; }
    canvas.dragging { cursor:grabbing; }
    .scene-label { position:absolute; left:16px; top:14px; margin:0; font-size:11px; font-weight:700; letter-spacing:.14em; color:#c7dcff; text-transform:uppercase; pointer-events:none; }
    .hint { position:absolute; left:16px; bottom:13px; color:var(--muted); font-size:12px; pointer-events:none; }
    .sidebar { min-width:0; display:flex; flex-direction:column; gap:12px; }
    .panel { min-width:0; border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:13px; backdrop-filter:blur(10px); }
    .panel h2, .panel h3 { margin:0 0 9px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#cbdbfa; }
    .readout { display:grid; gap:4px; }
    .readout strong { color:white; font-size:20px; font-variant-numeric:tabular-nums; }
    .detail { color:var(--muted); }
    .detail span { color:var(--ink); }
    .planet-list { display:grid; gap:7px; }
    .planet-item { width:100%; display:flex; align-items:center; justify-content:flex-start; gap:9px; text-align:left; }
    .dot { width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 10px currentColor; }
    .controls { display:grid; gap:10px; }
    .row { display:flex; align-items:center; gap:8px; min-width:0; }
    .row button { flex:1 1 0; }
    label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    .label-line { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    output { color:#fff; font-variant-numeric:tabular-nums; font-size:13px; }
    input[type="range"] { width:100%; accent-color:var(--accent); }
    .mode { color:var(--accent); font-size:12px; }
    @media (max-width:760px) {
      #app { min-height:100vh; grid-template-columns:minmax(0,1fr); gap:10px; padding:10px; }
      canvas { height:min(57vh,560px); min-height:360px; }
      .sidebar { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; }
      .sidebar .panel:last-child { grid-column:1 / -1; }
    }
    @media (max-width:430px) {
      #app { padding:8px; }
      .sidebar { grid-template-columns:minmax(0,1fr); }
      .sidebar .panel:last-child { grid-column:auto; }
      canvas { height:47vh; min-height:315px; }
      .hint { font-size:11px; left:12px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section class="stage" aria-label="Interactive three-dimensional solar system scene">
      <canvas id="scene" aria-label="Solar system. Drag to orbit the camera, scroll to zoom, and click a planet to select it."></canvas>
      <p class="scene-label">Solar system observatory</p>
      <p class="hint">Drag: orbit camera · Scroll: zoom · Click a planet: select</p>
    </section>

    <aside class="sidebar" aria-label="Solar system controls">
      <section class="panel" aria-live="polite">
        <h2>Simulation</h2>
        <div class="readout">
          <strong id="timeReadout">0.00 s</strong>
          <div class="detail">Range <span>0–120 simulation seconds</span></div>
          <div id="playState" class="mode">Running at 1.00×</div>
        </div>
      </section>

      <section class="panel">
        <h2>Planets</h2>
        <div id="planetList" class="planet-list" aria-label="Planet selection list"></div>
      </section>

      <section class="panel">
        <h2>Selected planet</h2>
        <div class="readout">
          <strong id="planetName">Aster</strong>
          <div class="detail">Orbit <span id="periodReadout">12 simulation seconds</span></div>
          <div class="detail">Angle <span id="angleReadout">0.0°</span></div>
          <div id="modeReadout" class="mode">Overview mode</div>
        </div>
      </section>

      <section class="panel controls">
        <h2>Controls</h2>
        <div class="row">
          <button id="playButton" type="button" aria-pressed="true">Pause</button>
          <button id="trackButton" type="button" aria-pressed="false">Track Aster</button>
        </div>
        <button id="overviewButton" type="button">Return to overview</button>
        <label for="timeSlider">
          <span class="label-line"><span>Seek time</span><output id="sliderOutput">0.00 s</output></span>
          <input id="timeSlider" type="range" min="0" max="120" step="0.01" value="0" aria-label="Seek simulation time">
        </label>
        <label for="speedSlider">
          <span class="label-line"><span>Global speed</span><output id="speedOutput">1.00×</output></span>
          <input id="speedSlider" type="range" min="0.25" max="4" step="0.25" value="1" aria-label="Global simulation speed">
        </label>
      </section>
    </aside>
  </main>

  <script>
    (() => {
      const planets = [
        { id: 'aster', name: 'Aster', period: 12, radius: 5.0, size: 0.55, color: '#54d6ff', phase: 0.30 },
        { id: 'boreal', name: 'Boreal', period: 24, radius: 8.3, size: 0.80, color: '#bb8cff', phase: 2.05 },
        { id: 'cinder', name: 'Cinder', period: 48, radius: 12.4, size: 1.08, color: '#ff9b63', phase: 4.15 }
      ];
      const canvas = document.querySelector('#scene');
      const ctx = canvas.getContext('2d');
      const list = document.querySelector('#planetList');
      const ui = {
        time: document.querySelector('#timeReadout'), slider: document.querySelector('#timeSlider'), sliderOutput: document.querySelector('#sliderOutput'),
        speed: document.querySelector('#speedSlider'), speedOutput: document.querySelector('#speedOutput'), play: document.querySelector('#playButton'),
        track: document.querySelector('#trackButton'), overview: document.querySelector('#overviewButton'), playState: document.querySelector('#playState'),
        planetName: document.querySelector('#planetName'), period: document.querySelector('#periodReadout'), angle: document.querySelector('#angleReadout'), mode: document.querySelector('#modeReadout')
      };
      const state = { time: 0, speed: 1, playing: true, selected: 0, tracking: false, yaw: -0.58, pitch: 0.48, zoom: 1, lastFrame: performance.now() };
      const renderedBodies = [];
      const stars = Array.from({ length: 125 }, (_, i) => ({ x: (i * 73 % 997) / 997, y: (i * 197 % 991) / 991, r: .35 + (i % 4) * .18, a: .22 + (i % 5) * .1 }));
      let pointer = null;

      function formatTime(value) { return `${value.toFixed(2)} s`; }
      function angleFor(planet) { return (planet.phase + state.time / planet.period * Math.PI * 2) % (Math.PI * 2); }
      function positionFor(planet, angle = angleFor(planet)) { return { x: Math.cos(angle) * planet.radius, y: 0, z: Math.sin(angle) * planet.radius }; }
      function selectedPlanet() { return planets[state.selected]; }
      function currentAngleDegrees() { return ((angleFor(selectedPlanet()) * 180 / Math.PI) + 360) % 360; }
      function setSelected(index) {
        state.selected = index;
        list.querySelectorAll('button').forEach((button, i) => button.classList.toggle('active', i === index));
        updateUI();
      }
      function updateUI() {
        const planet = selectedPlanet();
        const isAtEnd = state.time >= 120;
        ui.time.textContent = formatTime(state.time);
        ui.slider.value = String(state.time);
        ui.sliderOutput.value = formatTime(state.time);
        ui.speedOutput.value = `${state.speed.toFixed(2)}×`;
        ui.planetName.textContent = planet.name;
        ui.period.textContent = `${planet.period} simulation seconds`;
        ui.angle.textContent = `${currentAngleDegrees().toFixed(1)}°`;
        ui.play.textContent = state.playing ? 'Pause' : (isAtEnd ? 'Replay' : 'Resume');
        ui.play.setAttribute('aria-pressed', String(state.playing));
        ui.playState.textContent = state.playing ? `Running at ${state.speed.toFixed(2)}×` : `Paused at ${formatTime(state.time)} · ${state.speed.toFixed(2)}× ready`;
        ui.track.textContent = state.tracking ? `Stop tracking ${planet.name}` : `Track ${planet.name}`;
        ui.track.setAttribute('aria-pressed', String(state.tracking));
        ui.mode.textContent = state.tracking ? `Tracking ${planet.name}` : 'Overview mode';
      }
      function buildPlanetList() {
        planets.forEach((planet, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'planet-item';
          button.innerHTML = `<span class="dot" style="color:${planet.color};background:${planet.color}"></span><span>${planet.name} <small>· ${planet.period}s orbit</small></span>`;
          button.addEventListener('click', () => setSelected(index));
          list.appendChild(button);
        });
      }
      function syncCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { width: rect.width, height: rect.height };
      }
      function cameraTarget() { return state.tracking ? positionFor(selectedPlanet()) : { x: 0, y: 0, z: 0 }; }
      function project(world, view) {
        const target = cameraTarget();
        const x = world.x - target.x;
        const y = world.y - target.y;
        const z = world.z - target.z;
        const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw), cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
        const rx = x * cy - z * sy;
        const rz = x * sy + z * cy;
        const ry = y * cp - rz * sp;
        const depth = y * sp + rz * cp + 27;
        const focal = Math.min(view.width, view.height) * .88 * state.zoom;
        return { x: view.width / 2 + rx * focal / depth, y: view.height / 2 - ry * focal / depth, depth, scale: focal / depth };
      }
      function drawCircle(x, y, radius, fill, glow = 0) {
        if (glow) {
          const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius * glow);
          gradient.addColorStop(0, fill);
          gradient.addColorStop(.28, fill);
          gradient.addColorStop(1, 'transparent');
          ctx.fillStyle = gradient;
          ctx.beginPath(); ctx.arc(x, y, radius * glow, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = fill;
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      }
      function drawOrbit(planet, view) {
        ctx.beginPath();
        for (let i = 0; i <= 96; i += 1) {
          const a = i / 96 * Math.PI * 2;
          const point = project(positionFor(planet, a), view);
          if (i === 0) ctx.moveTo(point.x, point.y); else ctx.lineTo(point.x, point.y);
        }
        ctx.strokeStyle = planet.color + '45';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 5]); ctx.stroke(); ctx.setLineDash([]);
      }
      function render() {
        const view = syncCanvas();
        ctx.clearRect(0, 0, view.width, view.height);
        const bg = ctx.createRadialGradient(view.width * .5, view.height * .45, 5, view.width * .5, view.height * .45, Math.max(view.width, view.height) * .75);
        bg.addColorStop(0, '#152857'); bg.addColorStop(.4, '#080d28'); bg.addColorStop(1, '#02040d');
        ctx.fillStyle = bg; ctx.fillRect(0, 0, view.width, view.height);
        stars.forEach(star => { ctx.fillStyle = `rgba(210,230,255,${star.a})`; ctx.beginPath(); ctx.arc(star.x * view.width, star.y * view.height, star.r, 0, Math.PI * 2); ctx.fill(); });
        planets.forEach(planet => drawOrbit(planet, view));
        const objects = [{ type:'sun', position:{ x:0, y:0, z:0 }, size:1.75, color:'#ffd868', name:'Sun' }];
        planets.forEach((planet, index) => objects.push({ type:'planet', index, position:positionFor(planet), size:planet.size, color:planet.color, name:planet.name }));
        const drawn = objects.map(object => ({ ...object, screen:project(object.position, view) })).sort((a, b) => b.screen.depth - a.screen.depth);
        renderedBodies.length = 0;
        drawn.forEach(object => {
          const radius = Math.max(object.type === 'sun' ? 12 : 6, object.size * object.screen.scale * 1.25);
          if (object.type === 'sun') {
            drawCircle(object.screen.x, object.screen.y, radius, object.color, 3.2);
          } else {
            if (object.index === state.selected) {
              ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.arc(object.screen.x, object.screen.y, radius + 6, 0, Math.PI * 2); ctx.stroke();
            }
            drawCircle(object.screen.x, object.screen.y, radius, object.color, 2.1);
            ctx.fillStyle = '#f9fbff'; ctx.font = '600 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText(object.name, object.screen.x, object.screen.y - radius - 10);
            renderedBodies.push({ index: object.index, x:object.screen.x, y:object.screen.y, radius:radius + 8 });
          }
        });
        ctx.fillStyle = 'rgba(220,235,255,.7)'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
        if (state.tracking) ctx.fillText(`Tracking ${selectedPlanet().name}`, view.width / 2, 28);
        updateUI();
      }
      function tick(now) {
        const elapsed = Math.max(0, (now - state.lastFrame) / 1000);
        state.lastFrame = now;
        if (state.playing) {
          state.time = Math.min(120, state.time + elapsed * state.speed);
          if (state.time >= 120) state.playing = false;
        }
        render();
        requestAnimationFrame(tick);
      }
      function pointFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return { x:event.clientX - rect.left, y:event.clientY - rect.top };
      }
      canvas.addEventListener('pointerdown', event => {
        const point = pointFromEvent(event);
        pointer = { id:event.pointerId, start:point, previous:point, moved:false };
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (!pointer || pointer.id !== event.pointerId) return;
        const point = pointFromEvent(event);
        const dx = point.x - pointer.previous.x, dy = point.y - pointer.previous.y;
        if (Math.hypot(point.x - pointer.start.x, point.y - pointer.start.y) > 6) pointer.moved = true;
        if (pointer.moved) {
          state.yaw += dx * .012;
          state.pitch = Math.max(-1.1, Math.min(1.1, state.pitch + dy * .012));
          canvas.classList.add('dragging');
        }
        pointer.previous = point;
      });
      canvas.addEventListener('pointerup', event => {
        if (!pointer || pointer.id !== event.pointerId) return;
        const point = pointFromEvent(event);
        if (!pointer.moved) {
          const hit = renderedBodies.find(body => Math.hypot(body.x - point.x, body.y - point.y) <= body.radius);
          if (hit) setSelected(hit.index);
        }
        canvas.classList.remove('dragging');
        pointer = null;
      });
      canvas.addEventListener('pointercancel', () => { pointer = null; canvas.classList.remove('dragging'); });
      canvas.addEventListener('wheel', event => { event.preventDefault(); state.zoom = Math.max(.48, Math.min(2.6, state.zoom * (event.deltaY > 0 ? .91 : 1.1))); }, { passive:false });
      ui.play.addEventListener('click', () => {
        if (state.time >= 120) state.time = 0;
        state.playing = !state.playing;
        state.lastFrame = performance.now();
        updateUI();
      });
      ui.track.addEventListener('click', () => { state.tracking = !state.tracking; updateUI(); });
      ui.overview.addEventListener('click', () => { state.tracking = false; updateUI(); });
      ui.slider.addEventListener('input', event => { state.time = Number(event.target.value); state.playing = false; state.lastFrame = performance.now(); updateUI(); });
      ui.speed.addEventListener('input', event => { state.speed = Number(event.target.value); updateUI(); });
      buildPlanetList();
      setSelected(0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Observatory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#eaf2ff;font:14px system-ui,sans-serif;overflow-x:hidden}#app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:1fr auto}#stage{position:relative;min-height:520px;background:radial-gradient(circle at 50% 45%,#14213d,#050914 66%);overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;cursor:grab}canvas.dragging{cursor:grabbing}.badge{position:absolute;top:16px;left:16px;padding:7px 10px;border:1px solid #40598c;border-radius:99px;background:#071025cc;font-weight:700;letter-spacing:.08em;font-size:11px}.panel{padding:18px;background:#0a1122;border-left:1px solid #26395d;display:flex;flex-direction:column;gap:14px}.panel h1{font-size:18px;margin:0}.sub{color:#aab9d7;line-height:1.45}.info{background:#101d35;border:1px solid #2c4676;border-radius:10px;padding:12px;line-height:1.7}.info strong{color:#fff}.planet-list{display:grid;gap:7px}.planet-list button,.controls button{border:1px solid #415d93;background:#132445;color:#eaf2ff;border-radius:8px;padding:9px;text-align:left;cursor:pointer}.planet-list button.active{border-color:#fff;background:#24457c;box-shadow:0 0 0 2px #79b8ff66}.controls{display:grid;gap:9px}.controls button{text-align:center;font-weight:700}.controls label{display:grid;gap:5px;color:#cbd8ef}input[type=range]{width:100%;accent-color:#79b8ff}.time{font-variant-numeric:tabular-nums;font-size:18px;color:#fff}.hint{color:#91a6ca;font-size:12px;line-height:1.45}@media(max-width:650px){#app{grid-template-columns:1fr;grid-template-rows:minmax(380px,55vh) auto}.panel{border-left:0;border-top:1px solid #26395d;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel h1,.sub,.hint{grid-column:1/-1}.info{grid-column:1/-1}.controls{grid-column:1/-1}.planet-list{grid-template-columns:repeat(3,1fr)}.planet-list button{font-size:12px;padding:8px 4px;text-align:center}}
</style>
<body><main id="app"><section id="stage" aria-label="Interactive 3D solar system"><canvas id="scene"></canvas><div class="badge">SOLAR OBSERVATORY</div></section><aside class="panel"><h1>Three Planet System</h1><div class="sub">Drag to orbit the camera. Scroll to zoom. Click a planet to select it.</div><div class="info" aria-live="polite"><strong id="name">Aurelia</strong><br>Period: <span id="period">12</span> simulation seconds<br>Angle: <span id="angle">0</span>°</div><div class="planet-list" aria-label="Planet list"><button data-planet="0">Aurelia</button><button data-planet="1">Boreas</button><button data-planet="2">Ceres</button></div><div class="controls"><button id="play">Pause</button><button id="track">Track selected planet</button><button id="overview">Return to overview</button><label>Global speed <output id="speedOut">1.00x</output><input id="speed" type="range" min="0.25" max="4" step="0.25" value="1"></label><label>Simulation time <span class="time" id="timeOut">0.00 s</span><input id="time" type="range" min="0" max="120" step="0.01" value="0"></label></div><div class="hint">Orbital periods: 12 s, 24 s, 48 s. Playback stops at 120 s.</div></aside></main>
<script>
(()=>{
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const planets=[{name:'Aurelia',period:12,radius:10,color:'#ff815e',orbit:84,phase:0},{name:'Boreas',period:24,radius:14,color:'#6ab7ff',orbit:133,phase:1.25},{name:'Ceres',period:48,radius:18,color:'#c993ff',orbit:190,phase:2.7}];
let t=0,speed=1,playing=true,selected=0,tracking=false,last=performance.now(),yaw=.55,pitch=.35,zoom=1,drag=null,moved=false;
const $=s=>document.querySelector(s), name=$('#name'),period=$('#period'),angle=$('#angle'),timeOut=$('#timeOut'),timeInput=$('#time'),speedInput=$('#speed'),speedOut=$('#speedOut'),play=$('#play'),track=$('#track');
function pos(p,time=t){const a=(time/p.period*Math.PI*2+p.phase)%(Math.PI*2);return{x:Math.cos(a)*p.orbit,z:Math.sin(a)*p.orbit,a};}
function project(v){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let x=v.x*cy-v.z*sy,z=v.x*sy+v.z*cy,y=v.y||0;let yy=y*cp-z*sp;z=y*sp+z*cp;const f=Math.min(canvas.width,canvas.height)*.72*zoom/(430+z);return{x:canvas.width/2+x*f,y:canvas.height/2+yy*f,scale:f,z};}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(1,0,0,1,0,0)}
addEventListener('resize',resize);resize();
function updateUI(){const p=planets[selected],a=((pos(p).a*180/Math.PI)%360+360)%360;name.textContent=p.name;period.textContent=p.period;angle.textContent=a.toFixed(1);timeOut.textContent=t.toFixed(2)+' s';timeInput.value=t;speedOut.textContent=speed.toFixed(2)+'x';play.textContent=playing?'Pause':'Resume';track.textContent=tracking?'Tracking '+p.name:'Track selected planet';document.querySelectorAll('[data-planet]').forEach((b,i)=>b.classList.toggle('active',i===selected));}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const d=devicePixelRatio;ctx.save();ctx.scale(d,d);const w=canvas.width/d,h=canvas.height/d;ctx.fillStyle='#fff';for(let i=0;i<80;i++){let x=(i*89%997)/997*w,y=(i*151%991)/991*h;ctx.globalAlpha=.25+(i%4)*.15;ctx.fillRect(x,y,1,1)}ctx.globalAlpha=1;
let sun=project({x:0,z:0,y:0});let sg=ctx.createRadialGradient(sun.x/d,sun.y/d,2,sun.x/d,sun.y/d,42*zoom);sg.addColorStop(0,'#fff7bd');sg.addColorStop(.25,'#ffc550');sg.addColorStop(1,'#ff7a0000');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sun.x/d,sun.y/d,42*zoom,0,7);ctx.fill();
let drawables=[];planets.forEach((p,i)=>{ctx.strokeStyle='rgba(145,180,255,.23)';ctx.lineWidth=1;ctx.beginPath();for(let q=0;q<=100;q++){let a=q/100*Math.PI*2,pr=project({x:Math.cos(a)*p.orbit,z:Math.sin(a)*p.orbit});q?ctx.lineTo(pr.x/d,pr.y/d):ctx.moveTo(pr.x/d,pr.y/d)}ctx.stroke();let pr=project(pos(p));drawables.push({i,pr});});drawables.sort((a,b)=>a.pr.z-b.pr.z).forEach(({i,pr})=>{let p=planets[i],x=pr.x/d,y=pr.y/d,r=Math.max(4,p.radius*pr.scale/d);if(i===selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+6,0,7);ctx.stroke()}let g=ctx.createRadialGradient(x-r*.3,y-r*.4,1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.25,p.color);g.addColorStop(1,'#10152c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();});ctx.restore();return drawables;}
function frame(now){if(playing){t=Math.min(120,t+(now-last)/1000*speed);if(t>=120)playing=false}last=now;updateUI();draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function select(i){selected=i;updateUI()}document.querySelectorAll('[data-planet]').forEach(b=>b.onclick=e=>{e.stopPropagation();select(+b.dataset.planet)});
play.onclick=e=>{e.stopPropagation();playing=!playing;last=performance.now();updateUI()};track.onclick=e=>{e.stopPropagation();tracking=!tracking;updateUI()};$('#overview').onclick=e=>{e.stopPropagation();tracking=false;updateUI()};
speedInput.oninput=e=>{speed=+e.target.value;updateUI()};timeInput.oninput=e=>{t=+e.target.value;playing=false;last=performance.now();updateUI()};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=false;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;yaw+=dx*.008;pitch=Math.max(-1.15,Math.min(1.15,pitch+dy*.008));drag={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{canvas.classList.remove('dragging');if(!moved){let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=null;draw().forEach(o=>{let dx=o.pr.x/devicePixelRatio-x,dy=o.pr.y/devicePixelRatio-y;if(dx*dx+dy*dy<900)best=o.i});if(best!==null)select(best)}drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.8,zoom*(e.deltaY>0?.9:1.1)))},{passive:false});
})();
</script></body></html>

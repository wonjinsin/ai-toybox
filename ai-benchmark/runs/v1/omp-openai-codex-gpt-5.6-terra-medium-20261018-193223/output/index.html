<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Solar System Observatory</title><style>body{margin:0;background:#06111e;color:#eef;font:14px system-ui}main{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:10px}.scene{height:620px;background:#000}canvas{width:100%;height:100%}section{padding:10px;margin-bottom:10px;border:1px solid #456;border-radius:8px}button,input,textarea{margin:3px;font:inherit}textarea{width:100%;height:100px}button:focus,input:focus,textarea:focus{outline:3px solid #ffd166}.selected{background:#ffd166;color:#111}@media(max-width:700px){main{grid-template-columns:1fr}.scene{height:400px}}</style></head><body><main><div class=scene id=scene></div><div><section><h1>Solar System Observatory</h1><div id=status></div><button id=pause>Pause</button><label>Time <input id=time type=range min=0 max=120 step=.1></label><output id=out></output><label>Speed <input id=speed type=range min=.25 max=4 step=.25 value=1></label><output id=sp></output><div id=list aria-label="Planet list"></div><button id=track disabled>Track selected planet</button><button id=overview>Return to overview</button><p id=info>No planet selected.</p><p id=msg role=status></p></section><section><button id=capture>Capture snapshot</button><div id=snaps></div><p>Planet IDs: mercury, terra, neptune</p><label>Snapshot JSON<textarea id=json></textarea></label><button id=export>Export snapshots</button><button id=import>Import snapshots</button></section></div></main><script src=https://cdn.jsdelivr.net/npm/three@0.124.0/build/three.min.js></script><script>(()=>{const $=x=>document.getElementById(x),D=[['mercury','Mercury',0x78c7ff,12,5,0],['terra','Terra',0x62a9ff,24,8,1],['neptune','Neptune',0xb78cff,48,11,2]],sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100),ren=new THREE.WebGLRenderer({antialias:true}),ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),M={},key='obs2';let T=0,S=1,play=true,sel=null,view='overview',sn=[],last=performance.now(),drag=false,az=.6,el=.5,dist=24;$('scene').append(ren.domElement);sc.add(new THREE.AmbientLight(0xffffff,.8));let L=new THREE.PointLight(0xffffff,1.5);sc.add(L);sc.add(new THREE.Mesh(new THREE.SphereGeometry(2,24,16),new THREE.MeshBasicMaterial({color:0xffcb4b})));D.forEach(d=>{let m=new THREE.Mesh(new THREE.SphereGeometry(d[3]/4,20,12),new THREE.MeshStandardMaterial({color:d[2]}));m.userData={d,r:d[4]};sc.add(m);M[d[0]]=m;let b=document.createElement('button');b.textContent=d[1];b.onclick=()=>choose(d[0]);$('list').append(b);m.userData.b=b});function a(d,t=T){return(d[5]+t/d[3]*Math.PI*2)%(Math.PI*2)}function pos(){D.forEach(d=>{let m=M[d[0]],q=a(d);m.position.set(Math.cos(q)*d[4],0,Math.sin(q)*d[4]);m.material.emissive.setHex(sel===d[0]?0xffaa00:0)})}function choose(x){sel=x;$('track').disabled=false;ui()}function ui(){pos();$('time').value=T;$('out').textContent=T.toFixed(2)+' s';$('sp').textContent=S+'x';$('pause').textContent=play?'Pause':'Resume';$('status').textContent=`Time ${T.toFixed(2)} s · Speed ${S}x · ${play?'Playing':'Paused'} · ${view}`;D.forEach(d=>M[d[0]].userData.b.className=d[0]===sel?'selected':'');let d=D.find(x=>x[0]===sel);$('info').textContent=d?`${d[1]} — orbital period ${d[3]} s — angle ${(a(d)*180/Math.PI).toFixed(1)}°${view==='tracking'?' — tracking':''}`:'No planet selected.';draw()}function val(x){if(!x||Array.isArray(x)||x.version!==1||!Array.isArray(x.snapshots)||x.snapshots.length>3)throw Error('Invalid snapshot JSON.');let ids=new Set;return x.snapshots.map(v=>{if(!v||typeof v.id!=='string'||!v.id||ids.has(v.id)||!Number.isFinite(v.time)||v.time<0||v.time>120||!Number.isFinite(v.speed)||v.speed<.25||v.speed>4||![null,...D.map(d=>d[0])].includes(v.selectedPlanet)||!['overview','tracking'].includes(v.viewMode)||(v.viewMode==='tracking'&&!v.selectedPlanet))throw Error('Invalid snapshot JSON.');ids.add(v.id);return{id:v.id,time:v.time,speed:v.speed,selectedPlanet:v.selectedPlanet,viewMode:v.viewMode}})}function save(){try{localStorage.setItem(key,JSON.stringify({version:1,snapshots:sn}))}catch(e){$('msg').textContent='Saving is unavailable; snapshots remain in memory.'}}function draw(){$('snaps').innerHTML='';sn.forEach((x,i)=>{let q=document.createElement('div');q.textContent=`${x.id}: ${x.time}s ${x.speed}x ${x.selectedPlanet||'no selection'} ${x.viewMode}. Angles: ${D.map(d=>(a(d,x.time)*180/Math.PI).toFixed(1)+'°').join(', ')}`;let r=document.createElement('button');r.textContent='Restore';r.onclick=()=>{T=x.time;S=x.speed;sel=x.selectedPlanet;view=x.viewMode;play=false;az=.6;el=.5;dist=24;ui()};let z=document.createElement('button');z.textContent='Delete';z.onclick=()=>{sn.splice(i,1);save();ui()};q.append(r,z);$('snaps').append(q)})}$('pause').onclick=()=>{play=!play;ui()};$('time').oninput=e=>{T=+e.target.value;play=false;ui()};$('speed').oninput=e=>{S=+e.target.value;ui()};$('track').onclick=()=>{if(!sel)$('msg').textContent='Select a planet before tracking.';else{view='tracking';ui()}};$('overview').onclick=()=>{view='overview';ui()};$('capture').onclick=()=>{if(sn.length===3){$('msg').textContent='Snapshot capacity reached (three).';return}sn.push({id:'obs-'+Date.now()+'-'+sn.length,time:T,speed:S,selectedPlanet:sel,viewMode:view});save();ui()};$('export').onclick=()=>{$('json').value=JSON.stringify({version:1,snapshots:sn})};$('import').onclick=()=>{try{sn=val(JSON.parse($('json').value));save();$('msg').textContent='Snapshots imported.';ui()}catch(e){$('msg').textContent=e.message}};try{sn=val(JSON.parse(localStorage.getItem(key)||'{"version":1,"snapshots":[]}'))}catch(e){$('msg').textContent='Saved snapshots were invalid and were cleared.'}function resize(){let r=$('scene').getBoundingClientRect();ren.setSize(r.width,r.height);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}addEventListener('resize',resize);let down;ren.domElement.onpointerdown=e=>{down=[e.clientX,e.clientY];drag=false};ren.domElement.onpointermove=e=>{if(down){drag=true;az+=(e.clientX-down[0])*.01;el=Math.max(-1.2,Math.min(1.2,el+(e.clientY-down[1])*.01));down=[e.clientX,e.clientY]}};ren.domElement.onwheel=e=>{dist=Math.max(8,Math.min(40,dist+e.deltaY*.02))};ren.domElement.onpointerup=e=>{if(!drag){let r=ren.domElement.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pointer,cam);let h=ray.intersectObjects(Object.values(M))[0];if(h)choose(h.object.userData.d[0])}down=null};function loop(n){let dt=(n-last)/1000;last=n;if(play){T=Math.min(120,T+dt*S);if(T===120)play=false}pos();let target=view==='tracking'&&sel?M[sel].position:new THREE.Vector3();cam.position.set(target.x+dist*Math.cos(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.sin(az)*Math.cos(el));cam.lookAt(target);ren.render(sc,cam);ui();requestAnimationFrame(loop)}resize();ui();requestAnimationFrame(loop)})()</script></body></html>

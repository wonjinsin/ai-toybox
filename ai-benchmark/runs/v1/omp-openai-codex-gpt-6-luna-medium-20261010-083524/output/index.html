<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol Observatory — Solar System</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--panel:rgba(14,20,34,.88);--line:rgba(164,189,234,.16);--muted:#8d9bb7;--ink:#eef3ff;--cyan:#80d9ff;--gold:#ffcf82}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 36%,rgba(3,6,12,.36) 100%)}.topbar{position:fixed;left:26px;right:26px;top:22px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:12px;text-shadow:0 2px 18px #000}.brand-mark{width:34px;height:34px;border:1px solid #ffcf82;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:18px;box-shadow:0 0 24px #ffb85044}.brand strong{letter-spacing:.16em;font-size:12px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.19em;margin-top:3px}.live{border:1px solid var(--line);background:#0c1220bd;padding:8px 12px;border-radius:30px;font-size:10px;letter-spacing:.12em;color:#c8d6ec}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8fe0b2;margin-right:7px;box-shadow:0 0 10px #8fe0b2}.panel{position:fixed;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 14px 45px #0005;border-radius:14px}.left-panel{left:22px;top:88px;width:215px;padding:17px 14px}.eyebrow{font-size:9px;color:#8d9bb7;letter-spacing:.2em;text-transform:uppercase;margin:0 0 12px 2px}.planet-list{display:grid;gap:5px}.planet-option{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;color:#c6d0e3;padding:9px;border-radius:9px;cursor:pointer;transition:.18s}.planet-option:hover{background:#ffffff09}.planet-option.selected{background:#83d9ff12;border-color:#83d9ff3c;color:#f2f8ff}.planet-dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 13px currentColor;flex:none}.planet-meta{flex:1}.planet-name{display:block;font-size:12px;font-weight:600}.planet-kind{display:block;margin-top:2px;color:#8491a8;font-size:9px}.chevron{color:#7786a1;font-size:14px}.right-panel{right:22px;top:88px;width:238px;padding:17px}.panel-heading{display:flex;justify-content:space-between;align-items:center}.panel-heading .eyebrow{margin-bottom:0}.icon-btn{background:none;color:#8ba1bf;border:0;cursor:pointer;font-size:13px}.planet-title{font-size:23px;font-weight:600;letter-spacing:-.03em;margin:14px 0 3px}.planet-sub{font-size:10px;color:var(--muted);letter-spacing:.08em}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 14px}.stat{border-top:1px solid var(--line);padding-top:9px}.stat-label{font-size:9px;color:#8795ad;letter-spacing:.12em;text-transform:uppercase}.stat-value{font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}.angle-track{height:3px;background:#ffffff13;border-radius:3px;margin-top:8px;overflow:hidden}.angle-fill{height:100%;background:var(--cyan);width:0;box-shadow:0 0 12px var(--cyan)}.track-button,.overview-button{width:100%;border:1px solid #93dfff45;background:#83d9ff12;color:#ccefff;border-radius:8px;padding:9px 10px;font-size:11px;cursor:pointer;transition:.18s}.track-button:hover,.overview-button:hover{background:#83d9ff20}.track-button.active{background:#83d9ff24;color:#e9f9ff}.bottom-panel{left:50%;transform:translateX(-50%);bottom:22px;width:min(600px,calc(100vw - 32px));padding:13px 16px 12px}.transport{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.play-button{width:38px;height:38px;border-radius:50%;border:1px solid #e2efff45;background:#ffffff0b;color:white;cursor:pointer;font-size:13px}.play-button:hover{background:#ffffff18}.time-readout{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;color:#e7efff}.time-readout span{color:#8593ac;font-size:10px}.slider-wrap{display:flex;align-items:center;gap:10px}.range{width:100%;accent-color:#8cddff;cursor:pointer}.time-labels{display:flex;justify-content:space-between;color:#73819a;font-size:9px;margin:4px 0 0 53px}.toolbar{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:9px}.toolbar-label{font-size:9px;color:#8d9bb7;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.speed-select{appearance:none;background:#151e30;border:1px solid var(--line);color:#dceaff;border-radius:6px;padding:5px 23px 5px 8px;font-size:11px;cursor:pointer}.speed-wrap{position:relative}.speed-wrap:after{content:'⌄';position:absolute;right:8px;top:3px;color:#92a2bc;pointer-events:none}.toolbar-spacer{flex:1}.hint{font-size:9px;color:#73819a}.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);padding:7px 12px;border:1px solid var(--line);background:#101827dd;border-radius:20px;color:#b7c4db;font-size:10px;opacity:0;transition:opacity .4s;pointer-events:none}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#070b14;z-index:10;transition:opacity .5s}.loading.hidden{opacity:0;pointer-events:none}.loading-card{text-align:center;color:#b9c7df;font-size:11px;letter-spacing:.14em}.loader{width:30px;height:30px;border:1px solid #30415c;border-top-color:#94ddff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.topbar{left:14px;right:14px;top:12px}.brand-mark{width:29px;height:29px}.brand strong{font-size:10px}.brand small{font-size:8px}.live{font-size:9px;padding:7px 9px}.left-panel{left:10px;top:62px;width:152px;padding:11px 8px}.left-panel .eyebrow{margin-left:5px;margin-bottom:6px}.planet-option{padding:7px 6px;gap:7px}.planet-name{font-size:11px}.planet-kind{font-size:8px}.right-panel{right:10px;top:62px;width:174px;padding:11px}.planet-title{font-size:18px;margin:10px 0 2px}.planet-sub{font-size:9px}.stats{gap:6px;margin:12px 0 10px}.stat-label{font-size:8px}.stat-value{font-size:12px}.track-button,.overview-button{padding:8px 5px;font-size:10px}.bottom-panel{bottom:10px;width:calc(100vw - 20px);padding:10px 11px}.transport{gap:9px}.play-button{width:34px;height:34px}.time-readout{font-size:11px}.time-labels{margin-left:43px}.toolbar{gap:8px;padding-top:8px;margin-top:7px}.toolbar-label{font-size:8px}.hint{font-size:8px}}@media(max-width:390px){.left-panel{width:139px}.right-panel{width:160px}.planet-title{font-size:17px}.planet-option{gap:6px}.planet-kind{max-width:86px;overflow:hidden;white-space:nowrap}.hint{display:none}}@media(max-height:620px){.left-panel,.right-panel{top:58px}.bottom-panel{bottom:8px}.topbar{top:8px}.stats{margin:8px 0}.planet-title{margin-top:8px}}
</style>
</head>
<body>
<div id="stage" aria-label="Interactive three-dimensional solar system"></div><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><strong>SOL OBSERVATORY</strong><small>PLANETARY MOTION LAB · 01</small></div></div><div class="live"><i></i><span id="liveText">SYSTEM ACTIVE</span></div></header>
<aside class="panel left-panel" aria-label="Select a planet"><p class="eyebrow">Celestial bodies</p><div class="planet-list" id="planetList"></div></aside>
<aside class="panel right-panel" aria-label="Selected planet information"><div class="panel-heading"><p class="eyebrow">Target telemetry</p><button class="icon-btn" id="overviewTop" title="Return to full system overview" aria-label="Return to overview">↗</button></div><div class="planet-title" id="infoName">Mercury</div><div class="planet-sub" id="infoSub">INNER PLANET · ORBITAL DATA</div><div class="stats"><div class="stat"><div class="stat-label">Orbital period</div><div class="stat-value" id="periodValue">12.0 s</div></div><div class="stat"><div class="stat-label">Orbital angle</div><div class="stat-value" id="angleValue">0.0°</div><div class="angle-track"><div class="angle-fill" id="angleFill"></div></div></div></div><button class="track-button" id="trackButton">◎ &nbsp;Track selected planet</button></aside>
<section class="panel bottom-panel" aria-label="Simulation controls"><div class="transport"><button class="play-button" id="playButton" aria-label="Pause simulation" title="Pause / resume">Ⅱ</button><div><div class="slider-wrap"><input class="range" id="timeSlider" type="range" min="0" max="120" step="0.1" value="0" aria-label="Simulation time"><div class="time-readout" id="timeReadout">00.0 <span>/ 120 s</span></div></div><div class="time-labels"><span>00 s</span><span>60 s</span><span>120 s</span></div></div><div class="hint">SIM TIME</div></div><div class="toolbar"><span class="toolbar-label">Global speed</span><div class="speed-wrap"><select class="speed-select" id="speedSelect" aria-label="Global simulation speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div><span class="toolbar-spacer"></span><span class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</span></div></section><div class="toast" id="toast"></div><div class="loading" id="loading"><div class="loading-card"><div class="loader"></div>ALIGNING OBSERVATION SYSTEM</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script>
(()=>{'use strict';
const bodies=[{name:'Mercury',kind:'INNER PLANET',period:12,radius:.34,color:0xb8c4d4,orbit:4.15,phase:0,texture:0x717b88},{name:'Earth',kind:'TERRESTRIAL PLANET',period:24,radius:.53,color:0x6bbcff,orbit:6.15,phase:1.4,texture:0x2868a7},{name:'Jupiter',kind:'GAS GIANT',period:48,radius:.88,color:0xe6ae79,orbit:8.55,phase:2.55,texture:0xb4774b}];
const $=id=>document.getElementById(id), stage=$('stage');let scene,camera,renderer,controls,raycaster,mouse,star,selected=0,tracking=false,playing=true,time=0,speed=1,last=performance.now(),objects=[],hitTargets=[],dragStart=null;
function init(){if(!window.THREE||!THREE.OrbitControls){$('liveText').textContent='3D LIBRARY UNAVAILABLE';$('loading').classList.add('hidden');return}scene=new THREE.Scene();scene.background=new THREE.Color(0x070b14);camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,300);camera.position.set(0,10,15);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;stage.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=4;controls.maxDistance=30;controls.maxPolarAngle=Math.PI*.48;controls.target.set(0,0,0);controls.update();scene.add(new THREE.AmbientLight(0x9bb7e9,.55));let sunLight=new THREE.PointLight(0xffd69b,2.8,90,1.5);scene.add(sunLight);raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();makeStars();makeOrbits();makeSun();bodies.forEach((b,i)=>makePlanet(b,i));buildList();bind();resize();placeBodies();renderLoop();$('loading').classList.add('hidden');setTimeout(()=>$('loading').remove(),650)}
function makeStars(){let geo=new THREE.BufferGeometry(),pos=[],colors=[];for(let i=0;i<1600;i++){let r=34+Math.random()*115,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);pos.push(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));let c=new THREE.Color().setHSL(.55+Math.random()*.16,.24,.58+Math.random()*.38);colors.push(c.r,c.g,c.b)}geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.095,vertexColors:true,transparent:true,opacity:.85,sizeAttenuation:true})))}
function makeOrbits(){bodies.forEach(b=>{let points=[];for(let i=0;i<=192;i++){let a=i/192*Math.PI*2;points.push(new THREE.Vector3(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit))}let line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x8293b5,transparent:true,opacity:.2}));scene.add(line)})}
function makeSun(){let g=new THREE.SphereGeometry(1.22,48,48),m=new THREE.MeshBasicMaterial({color:0xffc56e});star=new THREE.Mesh(g,m);scene.add(star);let glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture(),color:0xffa642,transparent:true,opacity:.24,blending:THREE.AdditiveBlending,depthWrite:false}));glow.scale.set(6.6,6.6,1);star.add(glow);let core=new THREE.Mesh(new THREE.SphereGeometry(.95,36,36),new THREE.MeshBasicMaterial({color:0xffe1a0,transparent:true,opacity:.38}));star.add(core);}
function glowTexture(){let c=document.createElement('canvas');c.width=c.height=128;let x=c.getContext('2d'),g=x.createRadialGradient(64,64,2,64,64,64);g.addColorStop(0,'rgba(255,226,170,1)');g.addColorStop(.18,'rgba(255,176,70,.42)');g.addColorStop(1,'rgba(255,139,34,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function makePlanet(b,i){let group=new THREE.Group();scene.add(group);let mat=new THREE.MeshStandardMaterial({color:b.texture,roughness:.8,metalness:.03,emissive:b.color,emissiveIntensity:.035});let mesh=new THREE.Mesh(new THREE.SphereGeometry(b.radius,40,32),mat);mesh.userData.index=i;group.add(mesh);let glow=new THREE.Mesh(new THREE.SphereGeometry(b.radius*1.17,32,24),new THREE.MeshBasicMaterial({color:b.color,transparent:true,opacity:.075,side:THREE.BackSide,depthWrite:false}));group.add(glow);let ring=new THREE.Mesh(new THREE.TorusGeometry(b.radius*1.34,.018,5,64),new THREE.MeshBasicMaterial({color:b.color,transparent:true,opacity:.72}));ring.rotation.x=Math.PI/2;ring.visible=false;group.add(ring);let halo=new THREE.Mesh(new THREE.SphereGeometry(b.radius*1.3,20,16),new THREE.MeshBasicMaterial({color:b.color,transparent:true,opacity:.19,wireframe:true,depthWrite:false}));halo.visible=false;group.add(halo);objects.push({group,mesh,ring,halo});hitTargets.push(mesh)}
function buildList(){let list=$('planetList');bodies.forEach((b,i)=>{let button=document.createElement('button');button.type='button';button.className='planet-option';button.innerHTML='<span class="planet-dot" style="background:#'+b.color.toString(16)+';color:#'+b.color.toString(16)+'"></span><span class="planet-meta"><span class="planet-name">'+b.name+'</span><span class="planet-kind">'+b.kind+'</span></span><span class="chevron">›</span>';button.addEventListener('click',()=>selectPlanet(i));list.appendChild(button)});updateSelection()}
function bind(){ $('playButton').addEventListener('click',()=>{if(time>=120&& !playing)time=0;playing=!playing;updatePlay()});$('timeSlider').addEventListener('input',e=>{time=Number(e.target.value);playing=false;updatePlay();$('timeReadout').innerHTML=time.toFixed(1).padStart(4,'0')+' <span>/ 120 s</span>';placeBodies();updateInfo();updateCameraTarget()});$('speedSelect').addEventListener('change',e=>speed=Number(e.target.value));$('trackButton').addEventListener('click',()=>setTracking(!tracking));$('overviewTop').addEventListener('click',()=>setTracking(false));window.addEventListener('resize',resize);renderer.domElement.addEventListener('pointerdown',e=>{dragStart={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(!dragStart)return;let moved=Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y);dragStart=null;if(moved<5)pick(e)});renderer.domElement.addEventListener('pointercancel',()=>dragStart=null)}
function pick(e){let r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(mouse,camera);let hits=raycaster.intersectObjects(hitTargets,false);if(hits.length)selectPlanet(hits[0].object.userData.index)}
function selectPlanet(i){selected=i;updateSelection();updateInfo();if(tracking)updateCameraTarget()}
function updateSelection(){document.querySelectorAll('.planet-option').forEach((el,i)=>{el.classList.toggle('selected',i===selected);el.setAttribute('aria-pressed',i===selected?'true':'false')});objects.forEach((o,i)=>{o.ring.visible=i===selected;o.halo.visible=i===selected})}
function updateInfo(){let b=bodies[selected],angle=((b.phase+time/b.period*Math.PI*2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2),deg=angle*180/Math.PI;$('infoName').textContent=b.name;$('infoSub').textContent=b.kind+' · ORBITAL DATA';$('periodValue').textContent=b.period.toFixed(1)+' s';$('angleValue').textContent=deg.toFixed(1)+'°';$('angleFill').style.width=(deg/360*100)+'%'}
function placeBodies(){bodies.forEach((b,i)=>{let a=b.phase+time/b.period*Math.PI*2;objects[i].group.position.set(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit);objects[i].mesh.rotation.y=time*.025*(48/b.period)})}
function updateCameraTarget(){if(!tracking)return;let p=objects[selected].group.position;controls.target.lerp(new THREE.Vector3(p.x,p.y,p.z),.24)}
function setTracking(on){tracking=on;$('trackButton').classList.toggle('active',on);$('trackButton').innerHTML=on?'◎ &nbsp;Tracking active':'◎ &nbsp;Track selected planet';$('overviewTop').title=on?'Return to full-system overview':'Overview mode';if(on){let p=objects[selected].group.position;controls.target.copy(p);let dir=new THREE.Vector3().subVectors(camera.position,controls.target).normalize();camera.position.copy(p).add(dir.multiplyScalar(Math.max(6,bodies[selected].orbit*.8+5)));controls.update()}else{controls.target.set(0,0,0);let d=Math.max(15,camera.position.length());camera.position.set(0,Math.min(10,d*.48),Math.max(14,d*.9));controls.update()}showToast(on?'Tracking '+bodies[selected].name:'Full-system overview')}
function updatePlay(){$('playButton').textContent=playing?'Ⅱ':'▶';$('playButton').setAttribute('aria-label',playing?'Pause simulation':'Resume simulation');$('liveText').textContent=playing?'SYSTEM ACTIVE':'SIMULATION PAUSED'}
function renderLoop(now){requestAnimationFrame(renderLoop);let delta=Math.min((now-last)/1000,.08);last=now;if(playing){time=Math.min(120,time+delta*speed);if(time>=120){time=120;playing=false;updatePlay()}$('timeSlider').value=time;$('timeReadout').innerHTML=time.toFixed(1).padStart(4,'0')+' <span>/ 120 s</span>';placeBodies();updateInfo()}updateCameraTarget();star.rotation.y+=delta*.025;objects.forEach((o,i)=>{o.ring.rotation.z+=delta*(.25+i*.08)});controls.update();renderer.render(scene,camera)}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function showToast(s){let t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.style.opacity=0,1300)}
init();})();
</script>
</body>
</html>

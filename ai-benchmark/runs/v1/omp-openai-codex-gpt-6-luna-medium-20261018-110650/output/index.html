<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar System Observatory</title><style>
:root{color-scheme:dark;font:15px/1.45 system-ui,sans-serif;background:#070b18;color:#e6ecff}*{box-sizing:border-box}body{margin:0}header{padding:14px 20px;border-bottom:1px solid #27314e}h1{font-size:1.25rem;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 52px)}#scene{position:relative;min-height:560px;background:radial-gradient(ellipse at 50% 45%,#172445,#070b18 72%)}canvas{display:block;width:100%;height:100%;min-height:560px}aside{padding:16px;border-left:1px solid #27314e;overflow:auto}section{border:1px solid #293451;border-radius:10px;padding:12px;margin-bottom:12px;background:#0e1528}h2{font-size:1rem;margin:0 0 10px}label{display:block;margin:9px 0 4px}button,select,input,textarea{font:inherit;color:inherit;background:#18223b;border:1px solid #475779;border-radius:6px;padding:7px}button{cursor:pointer}button:hover{background:#263655}button:disabled{opacity:.5;cursor:not-allowed}input[type=range]{width:100%;padding:0}textarea{width:100%;min-height:118px;font:12px ui-monospace,monospace}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.readout{color:#aab9df;font-size:.9rem}.planet{cursor:pointer}.notice{min-height:1.4em;color:#ffcf85}.snap{border-top:1px solid #303b57;padding:8px 0;font-size:.85rem}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f6cb61;outline-offset:2px}.legend{font-size:.8rem;color:#aab9df}#info{min-height:44px}.mobile{display:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.layout aside{border-left:0;border-top:1px solid #27314e}.layout #scene,canvas{min-height:360px}header{padding:12px}}
</style></head><body><header><h1>Solar System Observatory</h1></header><div class="layout"><main id="scene" aria-label="Interactive three dimensional solar system"><canvas id="view" aria-label="Solar system scene; drag to orbit and scroll to zoom"></canvas></main><aside>
<section><h2>Simulation</h2><div class="row"><button id="play" aria-label="Pause simulation">Pause</button><span class="readout" id="timeRead">Time: 0.0 s</span></div><label for="time">Simulation time</label><input id="time" aria-label="Simulation time" type="range" min="0" max="120" step="0.1" value="0"><label for="speed">Global speed: <span id="speedRead">1.00x</span></label><input id="speed" aria-label="Global speed" type="range" min="0.25" max="4" step="0.05" value="1"></section>
<section><h2>Planets</h2><label for="planet">Select a planet</label><select id="planet" aria-label="Select a planet"><option value="">No selection</option><option value="mercury">Mercury (mercury)</option><option value="earth">Earth (earth)</option><option value="jupiter">Jupiter (jupiter)</option></select><div id="info" aria-live="polite">No planet selected.</div><div class="row"><button id="track" disabled>Track selected</button><button id="overview">Full-system overview</button></div><p class="legend">Planet IDs for snapshot JSON: mercury, earth, jupiter</p></section>
<section><h2>Snapshots (maximum 3)</h2><div class="row"><button id="capture">Capture snapshot</button><span id="snapmsg" class="notice" aria-live="polite"></span></div><div id="snaps"></div></section>
<section><h2>Snapshot JSON</h2><label for="json">Export or import the snapshot list</label><textarea id="json" spellcheck="false" aria-label="Snapshot JSON"></textarea><div class="row"><button id="export">Export</button><button id="import">Import</button></div><div id="msg" class="notice" aria-live="polite"></div></section>
</aside></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{'use strict';const ids=['mercury','earth','jupiter'],names=['Mercury','Earth','Jupiter'],period=[12,24,48],radii=[.24,.39,.56],dist=[3.4,5.5,7.8],colors=[0xc7a075,0x39a9ff,0xe79a48];let time=0,speed=1,playing=true,selected=null,mode='overview',snaps=[],last=performance.now(),drag=null,az=.16,el=.34,zoom=1,target=new THREE.Vector3(0,0,0),storageBad=false;
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(43,1,.1,100);scene.add(new THREE.AmbientLight(0x9aaad0,1.4));const key=new THREE.PointLight(0xffd59b,90,60);key.position.set(0,0,0);scene.add(key);const sun=new THREE.Mesh(new THREE.SphereGeometry(.8,32,24),new THREE.MeshBasicMaterial({color:0xffcc55}));scene.add(sun);const glow=new THREE.Mesh(new THREE.SphereGeometry(.98,24,20),new THREE.MeshBasicMaterial({color:0xff932e,transparent:true,opacity:.16}));scene.add(glow);const bodies=[],rings=[];for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(radii[i],24,18),new THREE.MeshStandardMaterial({color:colors[i],roughness:.55,emissive:colors[i],emissiveIntensity:.08}));scene.add(m);bodies.push(m);const ring=new THREE.Mesh(new THREE.RingGeometry(dist[i]-.012,dist[i]+.012,96),new THREE.MeshBasicMaterial({color:0x687594,side:THREE.DoubleSide,transparent:true,opacity:.34}));ring.rotation.x=-Math.PI/2;scene.add(ring);rings.push(ring)}
const $=s=>document.querySelector(s),elms={play:$('#play'),time:$('#time'),speed:$('#speed'),planet:$('#planet'),info:$('#info'),track:$('#track'),snaps:$('#snaps'),json:$('#json'),msg:$('#msg'),snapmsg:$('#snapmsg')};function ang(i,t=time){return (Math.PI*2*t/period[i])%(Math.PI*2)}function position(i,t=time){const a=ang(i,t);return [Math.cos(a)*dist[i],0,Math.sin(a)*dist[i]]}function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);function aim(){if(mode==='tracking'&&selected){const p=position(ids.indexOf(selected));target.set(...p)}else target.set(0,0,0);const d=(mode==='tracking'?5.3:16)*zoom;camera.position.set(target.x+d*Math.cos(el)*Math.sin(az),target.y+d*Math.sin(el),target.z+d*Math.cos(el)*Math.cos(az));camera.lookAt(target)}function update(){for(let i=0;i<3;i++){bodies[i].position.set(...position(i));bodies[i].material.emissiveIntensity=ids[i]===selected?.68:.08}aim();elms.time.value=String(time);$('#timeRead').textContent=`Time: ${time.toFixed(1)} s`;$('#speedRead').textContent=`${speed.toFixed(2)}x`;elms.planet.value=selected||'';elms.track.disabled=!selected;elms.track.textContent=mode==='tracking'?'Tracking selected':'Track selected';if(selected){const i=ids.indexOf(selected);elms.info.textContent=`${names[i]} · period ${period[i]} simulation seconds · angle ${(ang(i)*180/Math.PI).toFixed(1)}° · ${mode}`}else elms.info.textContent='No planet selected.'}
function frame(now){const dt=Math.min(.08,(now-last)/1000);last=now;if(playing){time+=dt*speed;if(time>=120){time=120;playing=false;elms.play.textContent='Resume';elms.play.setAttribute('aria-label','Resume simulation')}}update();renderer.render(scene,camera);requestAnimationFrame(frame)}function valid(raw){const x=JSON.parse(raw);if(!x||Array.isArray(x)||typeof x!=='object'||x.version!==1||!Array.isArray(x.snapshots)||x.snapshots.length>3)throw Error('Expected version 1 and zero to three snapshots.');const seen=new Set();const result=x.snapshots.map(s=>{if(!s||Array.isArray(s)||typeof s!=='object')throw Error('Each snapshot must be an object.');for(const k of ['id','time','speed','selectedPlanet','viewMode'])if(!Object.hasOwn(s,k))throw Error(`Missing ${k}.`);if(typeof s.id!=='string'||s.id.length<1||seen.has(s.id))throw Error('Snapshot IDs must be unique nonempty strings.');seen.add(s.id);if(typeof s.time!=='number'||!Number.isFinite(s.time)||s.time<0||s.time>120)throw Error('Snapshot time must be 0–120.');if(typeof s.speed!=='number'||!Number.isFinite(s.speed)||s.speed<.25||s.speed>4)throw Error('Snapshot speed must be .25–4.');if(s.selectedPlanet!==null&&!ids.includes(s.selectedPlanet))throw Error('Unknown selectedPlanet ID.');if(!['overview','tracking'].includes(s.viewMode)||s.viewMode==='tracking'&&s.selectedPlanet===null)throw Error('Invalid viewMode or tracking requires a selection.');return {id:s.id,time:s.time,speed:s.speed,selectedPlanet:s.selectedPlanet,viewMode:s.viewMode}});return result}function payload(list=snaps){return {version:1,snapshots:list.map(s=>({id:s.id,time:s.time,speed:s.speed,selectedPlanet:s.selectedPlanet,viewMode:s.viewMode}))}}function persist(){try{localStorage.setItem('solar-observatory-snapshots',JSON.stringify(payload()))}catch(e){storageBad=true;$('#msg').textContent='Saving unavailable; snapshots remain only in memory.'}}function detail(s){return `<div class="snap"><b>${s.id}</b> · ${s.time.toFixed(1)}s · ${s.speed}x · ${s.selectedPlanet||'none'} · ${s.viewMode}<br>Angles: ${ids.map((id,i)=>`${names[i]} ${(ang(i,s.time)*180/Math.PI).toFixed(1)}°`).join(' · ')}<div class="row"><button data-restore="${encodeURIComponent(s.id)}">Restore</button><button data-delete="${encodeURIComponent(s.id)}">Delete</button></div></div>`}function renderSnaps(){$('#snaps').innerHTML=snaps.map(detail).join('');$('#snaps').querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const s=snaps.find(v=>v.id===decodeURIComponent(b.dataset.restore));time=s.time;speed=s.speed;selected=s.selectedPlanet;mode=s.viewMode;playing=false;elms.play.textContent='Resume';elms.play.setAttribute('aria-label','Resume simulation');az=.16;el=.34;zoom=1;update()});$('#snaps').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{snaps=snaps.filter(v=>v.id!==decodeURIComponent(b.dataset.delete));persist();renderSnaps()})}
try{const saved=localStorage.getItem('solar-observatory-snapshots');if(saved!==null)snaps=valid(saved)}catch(e){snaps=[];$('#msg').textContent='Saved snapshots were invalid or storage unavailable; recovered with an empty list.'}renderSnaps();elms.play.onclick=()=>{playing=!playing;elms.play.textContent=playing?'Pause':'Resume';elms.play.setAttribute('aria-label',playing?'Pause simulation':'Resume simulation')};elms.time.oninput=()=>{time=+elms.time.value;playing=false;elms.play.textContent='Resume';elms.play.setAttribute('aria-label','Resume simulation');update()};elms.speed.oninput=()=>{speed=+elms.speed.value;update()};elms.planet.onchange=()=>{selected=elms.planet.value||null;update()};$('#track').onclick=()=>{if(selected){mode='tracking';update()}};$('#overview').onclick=()=>{mode='overview';update()};$('#capture').onclick=()=>{if(snaps.length===3){elms.snapmsg.textContent='Capacity reached: delete a snapshot before capturing.';return}elms.snapmsg.textContent='';let id;do{id='obs-'+crypto.randomUUID()}while(snaps.some(s=>s.id===id));snaps.push({id,time,speed,selectedPlanet:selected,viewMode:mode});persist();renderSnaps()};$('#export').onclick=()=>{elms.json.value=JSON.stringify(payload());$('#msg').textContent='Snapshot list exported.'};$('#import').onclick=()=>{try{const list=valid(elms.json.value);snaps=list;persist();renderSnaps();$('#msg').textContent='Snapshot list imported; live simulation unchanged.'}catch(e){$('#msg').textContent=`Import rejected: ${e.message}`}};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,az,el,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){az=drag.az-dx*.008;el=Math.max(-1.25,Math.min(1.25,drag.el+dy*.008))}});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const r=canvas.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(bodies)[0];if(hit)selected=ids[bodies.indexOf(hit.object)];update()}drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.52,Math.min(2.4,zoom*(e.deltaY>0?1.09:.92)))},{passive:false});update();resize();requestAnimationFrame(frame);window.__observatory={get state(){return {time,speed,playing,selected,mode,positions:bodies.map(x=>x.position.toArray()),three:!!THREE.WebGLRenderer}},get snaps(){return JSON.stringify(payload())}};
})();</script></body></html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar System Observatory</title><style>

</style></head><body><header><div><h1>☼ SOLAR SYSTEM OBSERVATORY</h1><p>Three bodies · deterministic orbital clock · saved observations</p></div><span id="playState" class="status" aria-live="polite">● PLAYING</span></header><main class="layout"><section class="stage" aria-label="Interactive three-dimensional solar system"><div id="scene"></div><div class="hud"><b id="hudTime">00.0 s</b><br><span id="hudMode">Full-system overview</span><br><span class="key">Drag to orbit · wheel to zoom</span></div></section><aside class="panel" aria-label="Observatory controls">

<script src="three.min.js"></script><script>
(()=>{'use strict';const ids=['mercury','venus','mars'], bodies=[{id:ids[0],name:'Mercury',color:0x76c4dd,r:.28,orbit:3.0,period:12,phase:0},{id:ids[1],name:'Venus',color:0xffbd68,r:.42,orbit:4.7,period:24,phase:1.1},{id:ids[2],name:'Mars',color:0xf16c65,r:.35,orbit:6.5,period:48,phase:2.2}],byId=Object.fromEntries(bodies.map(b=>[b.id,b]));const $=id=>document.getElementById(id), store='observatory-snapshots-v1';let t=0,speed=1,selected=null,mode='overview',playing=true,snaps=[],last=performance.now(),cameraYaw=.6,cameraPitch=.45,distance=11,drag=null,saveOK=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x050b14);scene.fog=new THREE.FogExp2(0x050b14,.011);const camera=new THREE.PerspectiveCamera(48,1,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;$('scene').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0x8095b5,.85));const lamp=new THREE.PointLight(0xffd38a,150,80,1.4);scene.add(lamp);const sun=new THREE.Mesh(new THREE.SphereGeometry(.78,36,24),new THREE.MeshBasicMaterial({color:0xffcc66}));scene.add(sun);const glow=new THREE.Mesh(new THREE.SphereGeometry(.92,30,20),new THREE.MeshBasicMaterial({color:0xffa534,transparent:true,opacity:.17,side:THREE.BackSide}));scene.add(glow);const orbitLines=[],meshes={},materials={};for(const b of bodies){const pts=[];for(let i=0;i<=160;i++){let a=i/160*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit))}const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x49617b,transparent:true,opacity:.42}));scene.add(line);orbitLines.push(line);const mat=new THREE.MeshStandardMaterial({color:b.color,roughness:.65,emissive:b.color,emissiveIntensity:.05});const m=new THREE.Mesh(new THREE.SphereGeometry(b.r,28,20),mat);m.userData.planet=b.id;scene.add(m);meshes[b.id]=m;materials[b.id]=mat}const stars=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<700;i++){starPos.push((Math.random()-.5)*90,(Math.random()-.5)*60,(Math.random()-.5)*90)}stars.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xb9d4ef,size:.045,transparent:true,opacity:.75})));
function pos(b,time){let a=b.phase+time/b.period*Math.PI*2;return {a,x:Math.cos(a)*b.orbit,z:Math.sin(a)*b.orbit}}function updateScene(){for(const b of bodies){const p=pos(b,t),m=meshes[b.id];m.position.set(p.x,0,p.z);materials[b.id].emissiveIntensity=b.id===selected?.38:.05; m.scale.setScalar(b.id===selected?1.15:1)}let target=new THREE.Vector3();if(mode==='tracking'&&selected){const m=meshes[selected];target.copy(m.position)}const cp=Math.cos(cameraPitch);camera.position.set(target.x+Math.sin(cameraYaw)*distance*cp,target.y+Math.sin(cameraPitch)*distance,target.z+Math.cos(cameraYaw)*distance*cp);camera.lookAt(target);$('hudTime').textContent=t.toFixed(1)+' s';$('hudMode').textContent=mode==='tracking'?'Tracking '+byId[selected].name:'Full-system overview';$('timeRead').textContent=t.toFixed(1)+' s';$('time').value=t;$('speedValue').textContent=speed.toFixed(2)+'×';$('playState').textContent=playing?'● PLAYING':'Ⅱ PAUSED';$('pause').textContent=playing?'Ⅱ Pause':'▶ Resume';$('pause').setAttribute('aria-label',playing?'Pause simulation':'Resume simulation');$('selectedName').textContent=selected?byId[selected].name+' ('+selected+')':'None';$('period').textContent=selected?byId[selected].period+' s':'—';$('angle').textContent=selected?(pos(byId[selected],t).a*180/Math.PI%360+360)%360+'°':'—';$('track').disabled=!selected;$('track').textContent=mode==='tracking'?'Tracking selected':'Track selection';$('planets').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===selected?'true':'false'));$('overview').setAttribute('aria-pressed',mode==='overview'?'true':'false');}
function resize(){const box=$('scene').getBoundingClientRect();renderer.setSize(box.width,box.height,false);camera.aspect=box.width/box.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe($('scene'));resize();function loop(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(playing){t=Math.min(120,t+dt*speed);if(t>=120){playing=false}}updateScene();renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function select(id){selected=id;if(!id)mode='overview';updateScene()}$('planets').innerHTML=bodies.map(b=>`<button class="planet" data-id="${b.id}" aria-pressed="false" aria-label="Select ${b.name}, ID ${b.id}"><span>● ${b.name}</span><span class="key">${b.id}</span></button>`).join('');$('idMap').textContent=bodies.map(b=>b.name+'='+b.id).join(' · ');$('planets').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)select(b.dataset.id)});$('pause').onclick=()=>{playing=!playing;last=performance.now();updateScene()};$('time').oninput=e=>{playing=false;t=Number(e.target.value);updateScene()};$('speed').oninput=e=>{speed=Number(e.target.value);updateScene()};$('track').onclick=()=>{if(selected)mode='tracking';updateScene()};$('overview').onclick=()=>{mode='overview';updateScene()};
const ray=new THREE.Raycaster();function pointerDown(e){drag={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)}function pointerMove(e){if(!drag)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>5)drag.moved=true;cameraYaw-=dx*.006;cameraPitch=Math.max(-1.15,Math.min(1.15,cameraPitch+dy*.006));drag.px=e.clientX;drag.py=e.clientY}function pointerUp(e){if(!drag)return;const click=!drag.moved;drag=null;if(click){const r=renderer.domElement.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1)),camera);const hit=ray.intersectObjects(Object.values(meshes))[0];if(hit)select(hit.object.userData.planet)}}renderer.domElement.addEventListener('pointerdown',pointerDown);renderer.domElement.addEventListener('pointermove',pointerMove);renderer.domElement.addEventListener('pointerup',pointerUp);renderer.domElement.addEventListener('wheel',e=>{distance=Math.max(5,Math.min(22,distance*Math.exp(e.deltaY*.001)));e.preventDefault()},{passive:false});
function validList(x){if(!x||typeof x!=='object'||Array.isArray(x)||x.version!==1||!Array.isArray(x.snapshots)||x.snapshots.length>3)return false;const seen=new Set();for(const s of x.snapshots){if(!s||typeof s!=='object'||Array.isArray(s)||!['id','time','speed','selectedPlanet','viewMode'].every(k=>Object.hasOwn(s,k)))return false;if(typeof s.id!=='string'||s.id.length<1||seen.has(s.id))return false;seen.add(s.id);if(typeof s.time!=='number'||!Number.isFinite(s.time)||s.time<0||s.time>120||typeof s.speed!=='number'||!Number.isFinite(s.speed)||s.speed<.25||s.speed>4)return false;if(s.selectedPlanet!==null&&(typeof s.selectedPlanet!=='string'||!byId[s.selectedPlanet]))return false;if(!['overview','tracking'].includes(s.viewMode)||s.viewMode==='tracking'&&s.selectedPlanet===null)return false}return true}function clean(s){return {id:s.id,time:s.time,speed:s.speed,selectedPlanet:s.selectedPlanet,viewMode:s.viewMode}}function persist(){try{localStorage.setItem(store,JSON.stringify({version:1,snapshots:snaps.map(clean)}));saveOK=true}catch(e){saveOK=false;$('snapNotice').textContent='Saving unavailable; snapshots are only in memory.'}}function load(){try{const raw=localStorage.getItem(store);if(raw){const v=JSON.parse(raw);if(validList(v))snaps=v.snapshots.map(clean);else{$('snapNotice').textContent='Saved snapshots were invalid; recovered with an empty list.';localStorage.removeItem(store)}}}catch(e){snaps=[];$('snapNotice').textContent='Snapshot storage unavailable; using an empty in-memory list.'}}function snapRender(){const box=$('snapshots');box.innerHTML=snaps.map((s,i)=>{const angles=bodies.map(b=>(((pos(b,s.time).a*180/Math.PI)%360+360)%360).toFixed(1)+'°').join(' / ');return `<article class="snapshot"><strong>${i+1}. ${s.id}</strong><p>${s.time.toFixed(1)}s · ${s.speed}× · ${s.selectedPlanet||'no selection'} · ${s.viewMode}<br>Angles Mercury / Venus / Mars: ${angles}</p><div class="actions"><button data-action="restore" data-index="${i}" aria-label="Restore snapshot ${s.id}">Restore</button><button data-action="delete" data-index="${i}" aria-label="Delete snapshot ${s.id}">Delete</button></div></article>`}).join('');$('capacity').textContent=snaps.length+'/3'}function payload(){return {version:1,snapshots:snaps.map(clean)}}$('capture').onclick=()=>{if(snaps.length>=3){$('snapNotice').textContent='Capacity reached: delete a snapshot before capturing another.';return}let id;do{id='obs-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}while(snaps.some(s=>s.id===id));snaps.push({id,time:t,speed,selectedPlanet:selected,viewMode:mode});persist();snapRender();$('snapNotice').textContent='Observation captured.'};$('snapshots').onclick=e=>{const b=e.target.closest('button[data-action]');if(!b)return;const i=Number(b.dataset.index),s=snaps[i];if(b.dataset.action==='delete'){snaps.splice(i,1);persist();snapRender();$('snapNotice').textContent='Snapshot deleted.'}else{t=s.time;speed=s.speed;selected=s.selectedPlanet;mode=s.viewMode;playing=false;cameraYaw=.6;cameraPitch=.45;distance=11;last=performance.now();updateScene();$('snapNotice').textContent='Snapshot restored; playback paused.'}};$('export').onclick=()=>{$('json').value=JSON.stringify(payload());$('ioNotice').textContent='Snapshot list exported to the textarea.'};$('import').onclick=()=>{let x;try{x=JSON.parse($('json').value)}catch(e){$('ioNotice').textContent='Import rejected: malformed JSON.';return}if(!validList(x)){$('ioNotice').textContent='Import rejected: payload does not satisfy the complete snapshot contract.';return}snaps=x.snapshots.map(clean);persist();snapRender();$('ioNotice').textContent='Snapshot list imported; live state unchanged.'};load();snapRender();updateScene();
let down=false;renderer.domElement.addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});})();
</script></body></html>
